name: Sync library

on:
  workflow_dispatch:
  # To sync nightly, uncomment:
  # schedule:
  #   - cron: '0 4 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install spotdl + ffmpeg
        run: |
          uv tool install --python 3.12 spotdl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download playlist
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
        run: |
          mkdir -p library
          spotdl download "$PLAYLIST_URL" --output "library/{artist} - {title}.{output-ext}"

      - name: Upload new tracks to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/upload-library.mjs library
